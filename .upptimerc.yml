# Attesteo service status, powered by Upptime (https://upptime.js.org).
# Checks run as GitHub Actions in this repository; the page is served by GitHub Pages.

owner: attesteo-ab
repo: status

# One entry per component shown on the status page.
# Add the signing page, admin app, API health, identity service and webhooks
# as their production hostnames go live. Secrets go in as $NAME, never inline.
sites:
  - name: Website (attesteo.com)
    url: https://attesteo.com
    icon: https://raw.githubusercontent.com/attesteo-ab/status/HEAD/assets/quill.svg
    maxResponseTime: 3000
  # BankID publishes its own status on an Atlassian Statuspage. We read its
  # summary API: anything but "indicator":"none" means BankID reports a problem.
  - name: BankID (external)
    url: https://status.bankid.com/api/v2/status.json
    icon: https://www.bankid.com/favicon.ico
    __dangerous__body_degraded_if_text_missing: '"indicator":"none"'

status-website:
  # Served at https://attesteo-ab.github.io/status until status.attesteo.com
  # exists in DNS. Then: remove baseUrl and set `cname: status.attesteo.com`.
  baseUrl: /status
  name: Attesteo status
  metaTags:
    - name: description
      content: Current status, response times and incidents for Attesteo's services, updated automatically every five minutes.
  logoUrl: https://raw.githubusercontent.com/attesteo-ab/status/HEAD/assets/logo.svg
  hideNavTitle: true
  faviconSvg: https://attesteo-ab.github.io/status/quill.svg
  themeUrl: https://attesteo-ab.github.io/status/attesteo.css
  introTitle: "**Attesteo service status.**"
  introMessage: Current status, response times and incidents for Attesteo's services, updated automatically every five minutes. Planned maintenance is announced here in advance. Questions? Write to [support@attesteo.com](mailto:support@attesteo.com).
  navbar: []

# Status page strings are Upptime's English defaults; only the footer is overridden.
i18n:
  liveStatus: Components
  footer: © 2026 Attesteo AB · [attesteo.com](https://attesteo.com) · [support@attesteo.com](mailto:support@attesteo.com)

# Response-time chart on the detail pages, in brand colours.
graphBackgroundColor: "#e3e9fd"
graphBorderColor: "#3155ed"

# Keep the repository metadata as we set it.
skipDescriptionUpdate: true
skipTopicsUpdate: true
